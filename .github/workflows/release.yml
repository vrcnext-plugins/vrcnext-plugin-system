# On a v* tag: pack the host + api sources the bridge compiles (spec §1: host/ holds
# packages/api/src and packages/host/src; esbuild needs no package.json), publish them with a
# SHA256SUMS the installer verifies against.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release, e.g. v0.2.0'
        required: true
        type: string

  # Disabled: workflows do not run under this account, so an automatic trigger here would
  # never fire. Uncomment if you fork this repository onto an account where Actions run.
  #   push:
  #     tags: ['v*']
  #   # Manual runs create the tag and release from the checked-out commit, for environments that can
  #   # push branches but not tags.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack host sources
        run: |
          set -euo pipefail
          test -f packages/host/src/index.ts
          test -f packages/api/src/index.ts
          mkdir -p dist-release
          # --sort/--mtime/--owner make the archive reproducible for a given commit.
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
            -czf dist-release/vrcnext-plugin-host-src.tar.gz \
            packages/api/src packages/host/src
          cd dist-release
          sha256sum vrcnext-plugin-host-src.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-release/vrcnext-plugin-host-src.tar.gz
            dist-release/SHA256SUMS
          generate_release_notes: true

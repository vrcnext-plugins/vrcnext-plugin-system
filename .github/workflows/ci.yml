# The full gate (typecheck, lint, tests, version agreement, build) on every push and PR.
name: ci

on:
  workflow_dispatch:
  # Disabled: workflows do not run under this account, so an automatic trigger here would
  # never fire. Uncomment if you fork this repository onto an account where Actions run.
  # push:
    # branches: ['**']
  # pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

# Template for a plugin repository's .github/workflows/sign.yml.
#
# Prefer signing locally: `node scripts/sign-plugin.mjs sign --key <your key file>`, then commit
# plugin.sig with the code. The signature exists to prove that the key holder — not merely
# someone who can push to the repository — made this tree. A job that signs whatever lands on
# main hands the key to anyone who can push (or open a workflow of their own that reads the
# secret), which is exactly the account takeover the signature is meant to survive.
#
# If you sign in Actions anyway, do it the way this template does:
#
# - Only by hand (`workflow_dispatch`), never on push.
# - With the key in an *environment* secret, not a repository secret: Settings → Environments →
#   New environment "signing", add VRCNEXT_SIGNING_KEY (the 64 hex characters from
#   `sign-plugin.mjs keygen`) there, and turn on "Required reviewers" so every run waits for
#   you to approve it. Restrict the environment to the main branch.
# - With one key per plugin, so a compromise of one repository does not sign for the others.
#
# The secret never leaves the runner: the signature is made there and only plugin.sig is pushed
# back.
name: Sign

on:
  workflow_dispatch:
  # Disabled on purpose: signing on push hands the key to anyone who can push. Leave it
  # commented out.
  #   push:
  #     branches: [main]
  #     paths-ignore: [plugin.sig]

permissions:
  contents: write

concurrency:
  group: sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    # The key lives in this environment, whose required reviewers approve each run.
    environment: signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign the tracked tree
        env:
          VRCNEXT_SIGNING_KEY: ${{ secrets.VRCNEXT_SIGNING_KEY }}
        run: |
          test -n "$VRCNEXT_SIGNING_KEY" || { echo "VRCNEXT_SIGNING_KEY is not set"; exit 1; }
          node scripts/sign-plugin.mjs sign
          node scripts/sign-plugin.mjs verify

      - name: Commit plugin.sig if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- plugin.sig && { echo "signature unchanged"; exit 0; }
          git add plugin.sig
          git commit -m "Sign $(git rev-parse --short HEAD^{commit})"
          git push
